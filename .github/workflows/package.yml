name: Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack the extension
        run: python3 scripts/package.py

      - name: Upload extension archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/dev_minerpl_caddyproxy.c7s.zip
          if-no-files-found: error
          archive: false

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          tag="v${version}"
          notes="Upload \`dev_minerpl_caddyproxy.c7s.zip\` in Admin → Extensions. The file is the extension archive itself."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/dev_minerpl_caddyproxy.c7s.zip --clobber
          else
            gh release create "$tag" dist/dev_minerpl_caddyproxy.c7s.zip \
              --title "$tag" \
              --notes "$notes"
          fi
